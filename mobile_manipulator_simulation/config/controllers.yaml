controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur5eshoulder_pan_joint
      - ur5eshoulder_lift_joint
      - ur5eelbow_joint
      - ur5ewrist_1_joint
      - ur5ewrist_2_joint
      - ur5ewrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur5eshoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      ur5eshoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      ur5eelbow_joint: { trajectory: 0.2, goal: 0.1 }
      ur5ewrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      ur5ewrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      ur5ewrist_3_joint: { trajectory: 0.2, goal: 0.1 }

gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint

diff_drive_controller:
  ros__parameters:
    left_wheel_names: [wheel_left_joint]
    right_wheel_names: [wheel_right_joint]
    wheel_separation: 0.634
    wheel_radius: 0.075
    open_loop: false
    position_feedback: true
    enable_odom_tf: true
    odom_frame_id: odom
    base_frame_id: base_link
    cmd_vel_timeout: 0.5
    publish_rate: 50.0
    # Velocity limits mirror the old BaseVelocityPlugin clamps. 4.40 defaults
    # has_*_limits=true with NaN values, so accel/jerk must be disabled explicitly.
    linear.x.max_velocity: 1.5
    linear.x.min_velocity: -1.5
    linear.x.has_acceleration_limits: false
    linear.x.has_jerk_limits: false
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.has_acceleration_limits: false
    angular.z.has_jerk_limits: false
