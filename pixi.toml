ros-jazzy-ros-base = "*"
pkg-config = "*"
compilers = "*"
make = "*"
ninja = "*"
ros-jazzy-ros2cli = "*"

# Build tools
colcon-common-extensions = "*"
cmake = "<4"

# Workspace dependencies
ros-jazzy-ament-cmake = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-realsense2-description = "*"
ros-jazzy-ros-gz = "*"
ros-jazzy-ros-gz-bridge = "*"
